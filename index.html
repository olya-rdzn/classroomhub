<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClassroomHub</title>
<style>
:root{--b:#3f2562;--t:#efe9f7;--bg:#f7f4fb;--l:#ddd3ea;--m:#6d6384;--ink:#1e1530}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{background:var(--b);color:#fff;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}.mute{color:var(--m)}.small,small{font-size:12px}.ok{color:#2f8f5b;font-weight:600}.err{color:#b42318}
button,input,select,textarea{font:inherit}
.btn{border:0;background:var(--b);color:#fff;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn.sm{padding:6px 12px;font-size:13px}.btn.ghost{background:#fff;color:var(--b);border:1px solid var(--l)}
header .btn{background:#fff;color:var(--b)}header .btn.ghost{background:none;color:#fff;border-color:#ffffff66}
input,textarea,select{width:100%;border:1px solid var(--l);border-radius:10px;padding:9px 11px;background:#fff;margin:4px 0}
header select{width:auto;margin:0}textarea{min-height:90px}input[type=checkbox]{width:auto;margin:0 4px 0 0}
.shell{display:grid;grid-template-columns:210px 1fr}nav{padding:12px 8px;background:#fff;border-right:1px solid var(--l);min-height:calc(100vh - 52px)}
nav h4{margin:12px 8px 4px;font-size:12px;color:var(--m)}
nav button,.tabs button{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:8px 10px;border-radius:9px;cursor:pointer;text-align:left}
nav button.on,.tabs button.on{background:var(--b);color:#fff}nav i{font-style:normal;font-size:12px;opacity:.8}
main{padding:18px;max-width:820px}.pad{padding:18px;max-width:560px;margin:auto}
h2{margin:0 0 6px}.card{background:#fff;border:1px solid var(--l);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.card p{margin:0 0 4px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}.row input{flex:1;min-width:160px}
.tag{background:var(--t);color:var(--b);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600}
.blur p{filter:blur(7px);cursor:pointer;user-select:none}.x{float:right;border:0;background:none;color:var(--m);cursor:pointer}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#fff;border-bottom:1px solid var(--l)}.tabs button{width:auto;white-space:nowrap}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.scale button{border:1px solid var(--l);background:#fff;border-radius:10px;padding:10px 2px;cursor:pointer;font-size:12px}
.scale b{display:block;font-size:20px}.scale .on{background:var(--b);color:#fff}
.bar{display:grid;grid-template-columns:18px 1fr 28px;gap:8px;align-items:center;margin:8px 0}.bar div{height:12px;background:var(--t);border-radius:9px;overflow:hidden}.bar div i{display:block;height:100%;background:var(--b)}
.login{max-width:320px;margin:15vh auto;padding:0 16px}
@media(max-width:700px){.shell{grid-template-columns:1fr}nav{min-height:0;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--l)}nav h4{display:none}nav button{width:auto;white-space:nowrap;gap:6px}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const sb=supabase.createClient('https://lxkalpglmelzggkiazfw.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4a2FscGdsbWVsemdna2lhemZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQzMTE1NzMsImV4cCI6MjEwOTg4NzU3M30.NILzEMAQAO_8j9AE4YQrhuUOqh3ZQ-CiEeeNA7sdEJQ');
const $=s=>document.querySelector(s),app=$('#app'),act={};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T={question:['Question wall','Ask something you would like explained.'],parking:['Parking lot','A tangent to revisit later.'],exit:['Exit ticket','Two quick answers before you leave.'],feedback:['Feedback box','Comments on pace, materials or atmosphere.'],confidence:['Confidence meter','How well do you understand today’s lesson?'],example:['Example bank','Share a real-world example of today’s concept.']};
const code=new URLSearchParams(location.search).get('c');
app.onclick=e=>{const b=e.target.closest('[data-a]');if(b)act[b.dataset.a]?.(b.dataset.v)};
code?student():instructor();

/* ---------- Student ---------- */
async function student(){
 const cid=localStorage.hubcid||(localStorage.hubcid=crypto.randomUUID());
 const {data:s}=await sb.rpc('hub_get_session',{p_code:code});
 if(!s){app.innerHTML='<header><b>ClassroomHub</b></header><main class="pad"><p class="mute">No lesson is live right now. Please check back during class.</p></main>';return}
 const tools=Object.keys(T).filter(t=>s.tools.includes(t));let tool=tools[0],msg='',my=0;
 const draw=()=>{
  if(!tool){app.innerHTML='<header><b>'+esc(s.course)+'</b></header><main class="pad"><p class="mute">No activities are open.</p></main>';return}
  const f={exit:'<label>Main thing I learned</label><textarea id="a"></textarea><label>What is still unclear</label><textarea id="b"></textarea>',
   feedback:'<select id="tp"><option>Pace</option><option>Materials</option><option>Atmosphere</option><option>Other</option></select><textarea id="a" placeholder="Your comment…"></textarea>',
   example:'<input id="tp" placeholder="Concept"><textarea id="a" placeholder="Your example…"></textarea>',
   confidence:'<div class="scale">'+[1,2,3,4,5].map(n=>`<button data-a="rate" data-v="${n}" class="${my==n?'on':''}"><b>${n}</b>${['Lost','Shaky','OK','Good','Got it'][n-1]}</button>`).join('')+'</div>'
  }[tool]||'<textarea id="a" placeholder="Type here…"></textarea>';
  app.innerHTML=`<header><b>${esc(s.course)}</b><span class="grow"></span><small>${esc(s.lesson)}</small></header>
  <div class="tabs">${tools.map(t=>`<button data-a="tab" data-v="${t}" class="${t===tool?'on':''}">${T[t][0]}</button>`).join('')}</div>
  <main class="pad"><h2>${T[tool][0]}</h2><p class="mute">${T[tool][1]}</p>
  ${s.accepting?`<div class="card">${f}${tool==='confidence'?'<p class="small mute">You can tap another number to change your rating.</p>':'<button class="btn" data-a="send">Send anonymously</button>'}</div>`:'<p class="mute">Submissions are closed.</p>'}
  <p class="ok">${msg}</p><p class="small mute">Anonymous: no name or account. Other students cannot see your answers.</p></main>`};
 const sub=async o=>{const {error}=await sb.rpc('hub_submit',{p_session:s.id,p_tool:tool,p_body:o.a||null,p_body2:o.b||null,p_topic:o.tp||null,p_rating:o.r||null,p_client:cid});msg=error?'Could not send. Submissions may be closed.':'Sent ✓';draw()};
 act.tab=v=>{tool=v;msg='';draw()};
 act.rate=v=>{my=+v;sub({r:+v})};
 act.send=()=>{const g=i=>($('#'+i)?.value||'').trim(),a=g('a'),b=g('b');if(a||b)sub({a,b,tp:g('tp')})};
 draw();
}

/* ---------- Instructor ---------- */
const st={courses:[],cid:localStorage.hubc,lessons:[],sessions:[],sess:null,entries:[],tool:'overview',blur:false,rev:{}};
const link=c=>location.origin+location.pathname+'?c='+c.code;
async function instructor(){
 app.onchange=async e=>{const d=e.target.dataset.s;if(!d)return;
  if(d==='course'){st.cid=e.target.value;localStorage.hubc=st.cid;load()}
  if(d==='blur'){st.blur=e.target.checked;st.rev={};render()}
  if(d==='tool'){const tl=[...document.querySelectorAll('[data-s=tool]:checked')].map(x=>x.value);await sb.from('hub-sessions').update({tools:tl}).eq('id',st.sess.id);load()}};
 const {data:{session}}=await sb.auth.getSession();session?load():loginView();
}
function loginView(m=''){app.innerHTML=`<div class="login"><h2>ClassroomHub</h2><p class="mute">Instructor sign-in</p><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password"><p><button class="btn" data-a="login">Sign in</button></p><p class="err">${esc(m)}</p></div>`}
act.login=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});error?loginView(error.message):load()};
act.out=async()=>{await sb.auth.signOut();loginView()};
async function load(){
 st.courses=(await sb.from('hub-courses').select('*').order('created_at')).data||[];
 if(!st.courses.find(c=>c.id===st.cid))st.cid=st.courses[0]?.id;
 st.lessons=[];st.sessions=[];st.sess=null;st.entries=[];
 if(st.cid){
  const [l,s]=await Promise.all([sb.from('hub-lessons').select('*').eq('course_id',st.cid).order('created_at'),sb.from('hub-sessions').select('*').eq('course_id',st.cid).order('created_at')]);
  st.lessons=l.data||[];st.sessions=s.data||[];st.sess=st.sessions.find(x=>x.active)||null;await loadEntries(false);
 }
 render();
 if(!st.ch)st.ch=sb.channel('hub').on('postgres_changes',{event:'*',schema:'public',table:'hub-entries'},()=>loadEntries()).subscribe();
}
async function loadEntries(r=true){
 st.entries=st.sess?(await sb.from('hub-entries').select('*').eq('session_id',st.sess.id).order('created_at',{ascending:false})).data||[]:[];
 if(r&&!document.activeElement?.matches('input,textarea'))render();
}
const nb=(id,n,k)=>`<button data-a="tool" data-v="${id}" class="${st.tool===id?'on':''}">${n}${k!=null?`<i>${k}</i>`:''}</button>`;
function render(){
 const c=st.courses.find(x=>x.id===st.cid),cnt=t=>st.entries.filter(e=>e.tool===t).length;
 app.innerHTML=`<header><b>ClassroomHub</b><span class="grow"></span>
 <select data-s="course">${st.courses.map(x=>`<option value="${x.id}" ${x.id===st.cid?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
 <button class="btn sm" data-a="newc">+ Course</button><button class="btn sm ghost" data-a="out">Sign out</button></header>
 <div class="shell"><nav>${nb('overview','Overview')}<h4>Tools</h4>${Object.keys(T).map(t=>nb(t,T[t][0],cnt(t))).join('')}</nav>
 <main>${c?panel(c):'<p class="mute">Create your first course with “+ Course”.</p>'}</main></div>`;
 const q=$('#qr');if(c&&q)new QRCode(q,{text:link(c),width:120,height:120});
}
function panel(c){
 const s=st.sess;
 if(st.tool==='overview'){
  const live=s&&st.lessons.find(l=>l.id===s.lesson_id);
  return `<h2>${esc(c.name)}</h2>
  <div class="card"><b>Student link</b> <span class="mute small">(permanent for this course; post it once in Google Classroom)</span>
  <div class="row"><input id="lk" readonly value="${link(c)}"><button class="btn sm" data-a="copy">Copy</button></div><div id="qr"></div></div>
  <div class="card">${s?`<b>Live: ${esc(live?.title)}</b> <span class="tag">${s.accepting?'open':'closed'}</span>
   <div class="row"><button class="btn sm" data-a="acc">${s.accepting?'Close submissions':'Reopen submissions'}</button><button class="btn sm ghost" data-a="end">End session</button><button class="btn sm ghost" data-a="csv" data-v="s">Export session CSV</button></div>
   <div class="row small">${Object.keys(T).map(t=>`<label><input type="checkbox" data-s="tool" value="${t}" ${s.tools.includes(t)?'checked':''}>${T[t][0]}</label>`).join(' ')}</div>`
   :'<b>No live session</b><p class="mute">Activate a lesson below. Students then see it at your course link.</p>'}</div>
  <div class="card"><b>Lessons</b>${st.lessons.map(l=>`<div class="row"><span class="grow">${esc(l.title)}</span>${s?.lesson_id===l.id?'<span class="tag">live</span>':`<button class="btn sm ghost" data-a="act" data-v="${l.id}">Activate</button>`}</div>`).join('')}
   <div class="row"><input id="nl" placeholder="New lesson, e.g. Week 5: Language attitudes"><button class="btn sm" data-a="addl">Add</button></div>
   <button class="btn sm ghost" data-a="csv" data-v="c">Export whole course CSV</button></div>`;
 }
 const t=st.tool,es=st.entries.filter(e=>e.tool===t);
 let h=`<div class="row"><h2 class="grow">${T[t][0]}</h2><label class="small"><input type="checkbox" data-s="blur" ${st.blur?'checked':''}>Presenter mode</label><button class="btn sm ghost" data-a="clr">Clear</button></div>`;
 if(!s)return h+'<p class="mute">No live session. Activate a lesson in Overview.</p>';
 if(t==='confidence'){
  const n=[1,2,3,4,5].map(i=>es.filter(e=>e.rating===i).length),tot=es.length,mx=Math.max(1,...n);
  return h+`<div class="card"><b style="font-size:32px">${tot?(es.reduce((a,e)=>a+e.rating,0)/tot).toFixed(1):'–'}</b> <span class="mute">/ 5 · ${tot} responses</span>${n.map((v,i)=>`<div class="bar"><b>${i+1}</b><div><i style="width:${v/mx*100}%"></i></div><span>${v}</span></div>`).join('')}</div>`;
 }
 return h+(es.map(e=>`<div class="card ${st.blur&&!st.rev[e.id]?'blur':''}" ${st.blur?`data-a="rev" data-v="${e.id}"`:''}>
  <p>${t==='exit'?'<b>Learned:</b> ':''}${esc(e.body)}</p>${e.body2?`<p><b>Unclear:</b> ${esc(e.body2)}</p>`:''}
  <small class="mute">${e.topic?esc(e.topic)+' · ':''}${new Date(e.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</small><button class="x" data-a="del" data-v="${e.id}">✕</button></div>`).join('')||'<p class="mute">Nothing yet. New entries appear automatically.</p>');
}
act.tool=v=>{st.tool=v;render()};
act.rev=v=>{st.rev[v]=!st.rev[v];render()};
act.copy=()=>navigator.clipboard.writeText($('#lk').value);
act.newc=async()=>{const name=prompt('Course name?');if(!name)return;const cd=name.toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,8)+Math.random().toString(36).slice(2,5);
 const {data}=await sb.from('hub-courses').insert({name,code:cd}).select().single();st.cid=data?.id;st.tool='overview';load()};
act.addl=async()=>{const t=$('#nl').value.trim();if(!t)return;await sb.from('hub-lessons').insert({course_id:st.cid,title:t});load()};
act.act=async id=>{await sb.from('hub-sessions').update({active:false}).eq('course_id',st.cid).eq('active',true);await sb.from('hub-sessions').insert({course_id:st.cid,lesson_id:id});load()};
act.end=async()=>{await sb.from('hub-sessions').update({active:false}).eq('id',st.sess.id);load()};
act.acc=async()=>{await sb.from('hub-sessions').update({accepting:!st.sess.accepting}).eq('id',st.sess.id);load()};
act.del=async id=>{await sb.from('hub-entries').delete().eq('id',id);loadEntries()};
act.clr=async()=>{if(st.sess&&confirm('Clear all '+T[st.tool][0]+' entries for this session?')){await sb.from('hub-entries').delete().eq('session_id',st.sess.id).eq('tool',st.tool);loadEntries()}};
act.csv=async v=>{
 const ids=v==='s'?[st.sess.id]:st.sessions.map(s=>s.id);if(!ids.length)return;
 const {data}=await sb.from('hub-entries').select('*').in('session_id',ids).order('created_at');
 const sm=Object.fromEntries(st.sessions.map(s=>[s.id,s])),lm=Object.fromEntries(st.lessons.map(l=>[l.id,l.title])),cn=st.courses.find(c=>c.id===st.cid).name;
 const q=x=>'"'+String(x??'').replace(/"/g,'""')+'"';
 const rows=[['course','lesson','date','tool','text','text2','topic','rating'],...(data||[]).map(e=>[cn,lm[sm[e.session_id].lesson_id],e.created_at,e.tool,e.body,e.body2,e.topic,e.rating])];
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));
 a.download='classroomhub-'+(v==='s'?'session':'course')+'.csv';a.click();
};
</script>
</body>
</html>
