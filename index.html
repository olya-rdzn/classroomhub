<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClassroomHub</title>
<style>
:root{--b:#3f2562;--t:#efe9f7;--bg:#f7f4fb;--l:#ddd3ea;--m:#6d6384;--ink:#1e1530}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;-webkit-text-size-adjust:100%}
header{background:var(--b);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}.mute{color:var(--m)}.small,small{font-size:13px}.ok{color:#2f8f5b;font-weight:600;min-height:1.4em}.err{color:#b42318}
button,input,select,textarea{font:inherit}
.btn{border:0;background:var(--b);color:#fff;border-radius:12px;padding:12px 18px;font-weight:600;cursor:pointer}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px}.btn.ghost{background:#fff;color:var(--b);border:1px solid var(--l)}.btn.red{background:#fff;color:#b42318;border:1px solid #f0c4c0}
header .btn{background:#fff;color:var(--b)}header .btn.ghost{background:none;color:#fff;border-color:#ffffff66}
input,textarea,select{width:100%;border:1px solid var(--l);border-radius:12px;padding:11px 12px;background:#fff;margin:4px 0;font-size:16px}
header select{width:auto;margin:0;font-size:14px}textarea{min-height:110px}input[type=checkbox]{width:auto;margin:0 5px 0 0}
.shell{display:grid;grid-template-columns:210px 1fr}nav{padding:12px 8px;background:#fff;border-right:1px solid var(--l);min-height:calc(100vh - 56px)}
nav h4{margin:12px 8px 4px;font-size:12px;color:var(--m)}
nav button{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:8px 10px;border-radius:9px;cursor:pointer;text-align:left;font-size:15px}
nav button.on{background:var(--b);color:#fff}nav i{font-style:normal;font-size:12px;opacity:.8}
main{padding:18px;max-width:840px}h2{margin:0 0 6px}h3{margin:18px 0 6px;font-size:16px}
.card{background:#fff;border:1px solid var(--l);border-radius:14px;padding:12px 14px;margin:0 0 10px}.card p{margin:0 0 4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}.row input{flex:1;min-width:160px}
.tag{background:var(--t);color:var(--b);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600}
.blur p{filter:blur(7px);cursor:pointer;user-select:none}.x{float:right;border:0;background:none;color:var(--m);cursor:pointer;font-size:16px}
.vt{float:left;margin:0 12px 0 0;min-width:46px;text-align:center;border:1px solid var(--l);border-radius:10px;padding:4px;font-weight:600;background:var(--bg)}
.bar{display:grid;grid-template-columns:18px 1fr 28px;gap:8px;align-items:center;margin:8px 0}.bar div{height:12px;background:var(--t);border-radius:9px;overflow:hidden}.bar div i{display:block;height:100%;background:var(--b)}
.chart{display:flex;gap:10px;overflow-x:auto;padding:4px 0}.col{flex:0 0 70px;text-align:center;font-size:12px}
.bw{height:120px;display:flex;align-items:flex-end}.bw div{width:100%;background:var(--b);border-radius:6px 6px 0 0}
details{margin:6px 0}summary{cursor:pointer;color:var(--b);font-weight:600}
.login{max-width:320px;margin:15vh auto;padding:0 16px}.banner{background:#fff4d6;border:1px solid #f0d58a;border-radius:10px;padding:8px 12px;margin-bottom:10px}
/* student, mobile first */
.pad{padding:16px 16px calc(100px + env(safe-area-inset-bottom));max-width:560px;margin:auto}
.bottom{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--l);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.bottom button{flex:1;border:0;background:none;padding:9px 2px 8px;font-size:11px;color:var(--m);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px}
.bottom button span{font-size:22px;line-height:1}.bottom button.on{color:var(--b);font-weight:700;background:var(--t)}
.send{width:100%;min-height:54px;font-size:17px;margin-top:8px}
.rate button{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;margin:0 0 10px;padding:0 16px;border:1px solid var(--l);border-radius:14px;background:#fff;font-size:17px;text-align:left}
.rate b{font-size:24px;width:28px}.rate .on{background:var(--b);color:#fff;border-color:var(--b)}
.q{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--l);border-radius:12px;padding:10px 12px;margin-bottom:8px}.q .qt{flex:1}
.q button{border:1px solid var(--l);background:var(--bg);border-radius:10px;min-width:56px;min-height:44px;font-weight:600;color:var(--b)}.q button.on{background:var(--b);color:#fff}
@media(max-width:700px){.shell{grid-template-columns:1fr}nav{min-height:0;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--l)}nav h4{display:none}nav button{width:auto;white-space:nowrap;gap:6px}main{padding:14px}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const sb=supabase.createClient('https://lxkalpglmelzggkiazfw.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4a2FscGdsbWVsemdna2lhemZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQzMTE1NzMsImV4cCI6MjEwOTg4NzU3M30.NILzEMAQAO_8j9AE4YQrhuUOqh3ZQ-CiEeeNA7sdEJQ');
const $=s=>document.querySelector(s),app=$('#app'),act={};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T={question:['Question wall','Ask anything about the lesson.'],exit:['Exit ticket','Two quick answers before you leave.'],feedback:['Feedback box','Comments on pace, materials or atmosphere.'],confidence:['Confidence meter','How well do you understand today’s lesson?'],parking:['Parking lot','A tangent or idea to revisit later.']};
const SH={question:['💬','Ask'],exit:['🎫','Exit'],feedback:['📝','Feedback'],confidence:['📊','Rate'],parking:['🅿️','Parking']};
const code=new URLSearchParams(location.search).get('c');
app.onclick=e=>{const b=e.target.closest('[data-a]');if(b)act[b.dataset.a]?.(b.dataset.v)};
code?student():instructor();

/* ---------- Student ---------- */
async function student(){
 const cid=localStorage.hubcid||(localStorage.hubcid=crypto.randomUUID());
 const get=async()=>(await sb.rpc('hub_get_session',{p_code:code})).data;
 let s=await get();
 if(!s){app.innerHTML='<header><b>ClassroomHub</b></header><main class="pad"><p class="mute">No lesson is live right now. Please check back during class.</p></main>';return}
 let tool,msg='',my=0;
 const tools=()=>Object.keys(T).filter(t=>s.tools.includes(t));
 tool=tools()[0];
 async function loadWall(){const w=$('#wall');if(!w)return;const {data}=await sb.rpc('hub_questions',{p_session:s.id,p_client:cid});
  if(!$('#wall'))return;$('#wall').innerHTML=(data||[]).map(q=>`<div class="q"><span class="qt">${esc(q.body)}</span><button data-a="vote" data-v="${q.id}" class="${q.mine?'on':''}">▲ ${q.votes}</button></div>`).join('')||'<p class="mute">No questions yet.</p>'}
 const draw=()=>{
  const ts=tools();if(!ts.includes(tool))tool=ts[0];
  if(!tool){app.innerHTML='<header><b>'+esc(s.course)+'</b></header><main class="pad"><p class="mute">No activities are open right now.</p></main>';return}
  const f={exit:'<label>Main thing I learned</label><textarea id="a"></textarea><label>What is still unclear</label><textarea id="b"></textarea>',
   feedback:'<select id="tp"><option>Pace</option><option>Materials</option><option>Atmosphere</option><option>Other</option></select><textarea id="a" placeholder="Your comment…"></textarea>',
   confidence:'<div class="rate">'+[1,2,3,4,5].map(n=>`<button data-a="rate" data-v="${n}" class="${my==n?'on':''}"><b>${n}</b>${['Lost','Shaky','OK','Good','Got it'][n-1]}</button>`).join('')+'</div>'
  }[tool]||'<textarea id="a" placeholder="Type here…"></textarea>';
  app.innerHTML=`<header><b>${esc(s.course)}</b><span class="grow"></span><small>${esc(s.lesson)}</small></header>
  <main class="pad"><h2>${T[tool][0]}</h2><p class="mute">${T[tool][1]}</p>
  ${s.accepting?(tool==='confidence'?f+'<p class="small mute">Tap another number to change your rating.</p>':`${f}<button class="btn send" data-a="send">Send anonymously</button>`):'<p class="mute">Submissions are closed.</p>'}
  <p class="ok">${msg}</p>
  ${tool==='question'&&s.share?'<h3>Questions from the class — tap ▲ to upvote</h3><div id="wall"></div>':''}
  <p class="small mute">Anonymous: no name or account needed.</p></main>
  <div class="bottom">${ts.map(t=>`<button data-a="tab" data-v="${t}" class="${t===tool?'on':''}"><span>${SH[t][0]}</span>${SH[t][1]}</button>`).join('')}</div>`;
  loadWall()};
 const sub=async o=>{const {error}=await sb.rpc('hub_submit',{p_session:s.id,p_tool:tool,p_body:o.a||null,p_body2:o.b||null,p_topic:o.tp||null,p_rating:o.r||null,p_client:cid});msg=error?'Could not send. Submissions may be closed.':'Sent ✓';draw()};
 act.tab=async v=>{tool=v;msg='';s=(await get())||s;draw()};
 act.rate=v=>{my=+v;sub({r:+v})};
 act.send=()=>{const g=i=>($('#'+i)?.value||'').trim(),a=g('a'),b=g('b');if(a||b)sub({a,b,tp:g('tp')})};
 act.vote=async v=>{await sb.rpc('hub_vote',{p_entry:v,p_client:cid});loadWall()};
 setInterval(loadWall,8000);
 draw();
}

/* ---------- Instructor ---------- */
const st={courses:[],cid:localStorage.hubc,lessons:[],sessions:[],sess:null,view:null,entries:[],votes:{},all:[],tool:'overview',blur:false,rev:{}};
const link=c=>location.origin+location.pathname+'?c='+c.code;
const cur=()=>st.sessions.find(x=>x.id===st.view)||st.sess;
const ltitle=s=>st.lessons.find(l=>l.id===s.lesson_id)?.title||'?';
const fdate=d=>new Date(d).toLocaleDateString([], {day:'numeric',month:'short'});
async function instructor(){
 app.onchange=async e=>{const d=e.target.dataset.s;if(!d)return;
  if(d==='course'){st.cid=e.target.value;st.view=null;localStorage.hubc=st.cid;load()}
  if(d==='blur'){st.blur=e.target.checked;st.rev={};render()}
  if(d==='share'){await sb.from('hub-sessions').update({share_questions:e.target.checked}).eq('id',st.sess.id);load()}
  if(d==='tool'){const tl=[...document.querySelectorAll('[data-s=tool]:checked')].map(x=>x.value);await sb.from('hub-sessions').update({tools:tl}).eq('id',st.sess.id);load()}};
 const {data:{session}}=await sb.auth.getSession();session?load():loginView();
}
function loginView(m=''){app.innerHTML=`<div class="login"><h2>ClassroomHub</h2><p class="mute">Instructor sign-in</p><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password"><p><button class="btn" data-a="login">Sign in</button></p><p class="err">${esc(m)}</p></div>`}
act.login=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});error?loginView(error.message):load()};
act.out=async()=>{await sb.auth.signOut();loginView()};
async function load(){
 st.courses=(await sb.from('hub-courses').select('*').order('created_at')).data||[];
 if(!st.courses.find(c=>c.id===st.cid))st.cid=st.courses[0]?.id;
 st.lessons=[];st.sessions=[];st.sess=null;st.all=[];
 if(st.cid){
  const [l,s]=await Promise.all([sb.from('hub-lessons').select('*').eq('course_id',st.cid).order('created_at'),sb.from('hub-sessions').select('*').eq('course_id',st.cid).order('created_at')]);
  st.lessons=l.data||[];st.sessions=s.data||[];st.sess=st.sessions.find(x=>x.active)||null;
  if(!st.sessions.find(x=>x.id===st.view))st.view=null;
  const ids=st.sessions.map(x=>x.id);
  if(ids.length)st.all=(await sb.from('hub-entries').select('session_id,tool,rating,body2').in('session_id',ids)).data||[];
 }
 await loadEntries(false);render();
 if(!st.ch)st.ch=sb.channel('hub').on('postgres_changes',{event:'*',schema:'public',table:'hub-entries'},()=>loadEntries()).on('postgres_changes',{event:'*',schema:'public',table:'hub-votes'},()=>loadEntries()).subscribe();
}
async function loadEntries(r=true){
 const s=cur();st.entries=[];st.votes={};
 if(s){st.entries=(await sb.from('hub-entries').select('*').eq('session_id',s.id).order('created_at',{ascending:false})).data||[];
  const qs=st.entries.filter(e=>e.tool==='question').map(e=>e.id);
  if(qs.length)((await sb.from('hub-votes').select('entry_id').in('entry_id',qs)).data||[]).forEach(v=>st.votes[v.entry_id]=(st.votes[v.entry_id]||0)+1);}
 if(r&&!document.activeElement?.matches('input,textarea'))render();
}
const nb=(id,n,k)=>`<button data-a="tool" data-v="${id}" class="${st.tool===id?'on':''}">${n}${k!=null?`<i>${k}</i>`:''}</button>`;
function render(){
 const c=st.courses.find(x=>x.id===st.cid),cnt=t=>st.entries.filter(e=>e.tool===t).length;
 app.innerHTML=`<header><b>ClassroomHub</b><span class="grow"></span>
 <select data-s="course">${st.courses.map(x=>`<option value="${x.id}" ${x.id===st.cid?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
 <button class="btn sm" data-a="newc">+ Course</button><button class="btn sm ghost" data-a="out">Sign out</button></header>
 <div class="shell"><nav>${nb('overview','Overview')}${nb('trends','Trends')}<h4>Tools</h4>${Object.keys(T).map(t=>nb(t,T[t][0],cnt(t))).join('')}</nav>
 <main>${c?panel(c):'<p class="mute">Create your first course with “+ Course”.</p>'}</main></div>`;
 const q=$('#qr');if(c&&q)new QRCode(q,{text:link(c),width:120,height:120});
}
function sessRow(s){const l=ltitle(s);return `<div class="row"><span class="grow">${esc(l)} <small class="mute">${fdate(s.created_at)}</small> ${s.active?'<span class="tag">live</span>':''}</span>
 <button class="btn sm ghost" data-a="view" data-v="${s.id}">View</button><button class="btn sm ghost" data-a="csv" data-v="${s.id}">CSV</button>
 ${s.active?'':`<button class="btn sm ghost" data-a="arch" data-v="${s.id}">${s.archived?'Unarchive':'Archive'}</button>`}<button class="btn sm red" data-a="dels" data-v="${s.id}">Delete</button></div>`}
function panel(c){
 const s=st.sess;
 if(st.tool==='overview'){
  const live=s&&st.lessons.find(l=>l.id===s.lesson_id),rec=st.sessions.filter(x=>!x.archived).slice().reverse(),arc=st.sessions.filter(x=>x.archived).slice().reverse();
  return `<h2>${esc(c.name)}</h2>
  <div class="card"><b>Student link</b> <span class="mute small">(permanent for this course; post it once in Google Classroom)</span>
  <div class="row"><input id="lk" readonly value="${link(c)}"><button class="btn sm" data-a="copy">Copy</button></div><div id="qr"></div></div>
  <div class="card">${s?`<b>Live: ${esc(live?.title)}</b> <span class="tag">${s.accepting?'open':'closed'}</span>
   <div class="row"><button class="btn sm" data-a="acc">${s.accepting?'Close submissions':'Reopen submissions'}</button><button class="btn sm ghost" data-a="end">End session</button></div>
   <div class="row small">${Object.keys(T).map(t=>`<label><input type="checkbox" data-s="tool" value="${t}" ${s.tools.includes(t)?'checked':''}>${T[t][0]}</label>`).join(' ')}</div>
   <div class="row small"><label><input type="checkbox" data-s="share" ${s.share_questions?'checked':''}>Students see questions and can upvote them</label></div>`
   :'<b>No live session</b><p class="mute">Activate a lesson below. Students then see it at your course link.</p>'}</div>
  <div class="card"><b>Lessons</b>${st.lessons.map(l=>`<div class="row"><span class="grow">${esc(l.title)}</span>${s?.lesson_id===l.id?'<span class="tag">live</span>':`<button class="btn sm ghost" data-a="act" data-v="${l.id}">Activate</button>`}<button class="btn sm red" data-a="dell" data-v="${l.id}">Delete</button></div>`).join('')}
   <div class="row"><input id="nl" placeholder="New lesson, e.g. Week 5: Language attitudes"><button class="btn sm" data-a="addl">Add</button></div></div>
  <div class="card"><b>Sessions</b>${rec.map(sessRow).join('')||'<p class="mute">None yet.</p>'}
   ${arc.length?`<details><summary>Archived (${arc.length})</summary>${arc.map(sessRow).join('')}</details>`:''}
   <div class="row"><button class="btn sm ghost" data-a="csv" data-v="c">Export whole course CSV</button></div></div>
  <div class="card"><button class="btn sm red" data-a="delc">Delete this course and all its data</button></div>`;
 }
 if(st.tool==='trends'){
  const rows=st.sessions.map(x=>{const es=st.all.filter(e=>e.session_id===x.id),r=es.filter(e=>e.tool==='confidence');
   return {x,t:ltitle(x),avg:r.length?r.reduce((a,e)=>a+e.rating,0)/r.length:null,n:r.length,q:es.filter(e=>e.tool==='question').length,ex:es.filter(e=>e.tool==='exit').length,un:es.filter(e=>e.tool==='exit'&&e.body2).map(e=>e.body2)}});
  const cr=rows.filter(r=>r.avg!=null);
  return `<h2>Trends</h2><p class="mute">Across all sessions of ${esc(c.name)}.</p>
  <div class="card"><b>Average confidence per session</b>${cr.length?`<div class="chart">${cr.map(r=>`<div class="col"><b>${r.avg.toFixed(1)}</b><div class="bw"><div style="height:${r.avg/5*100}%"></div></div>${esc(r.t.slice(0,16))}<br><span class="mute">${fdate(r.x.created_at)}</span></div>`).join('')}</div>`:'<p class="mute">No confidence ratings yet.</p>'}</div>
  <div class="card"><b>Sessions</b>${rows.map(r=>`<details><summary>${esc(r.t)} · ${fdate(r.x.created_at)}</summary><p class="small mute">${r.avg!=null?'Confidence '+r.avg.toFixed(1)+' ('+r.n+')':'No ratings'} · ${r.q} questions · ${r.ex} exit tickets</p>
   ${r.un.length?'<b class="small">Still unclear:</b><ul>'+r.un.map(u=>`<li>${esc(u)}</li>`).join('')+'</ul>':''}</details>`).join('')||'<p class="mute">No sessions yet.</p>'}</div>`;
 }
 const v=cur(),t=st.tool,es=st.entries.filter(e=>e.tool===t);
 let h=(v&&v!==st.sess?`<div class="banner">Viewing a past session: <b>${esc(ltitle(v))}</b> (${fdate(v.created_at)}). <button class="btn sm ghost" data-a="live">Back to live</button></div>`:'')+
  `<div class="row"><h2 class="grow">${T[t][0]}</h2><label class="small"><input type="checkbox" data-s="blur" ${st.blur?'checked':''}>Presenter mode</label><button class="btn sm ghost" data-a="clr">Clear</button></div>`;
 if(!v)return h+'<p class="mute">No live session. Activate a lesson in Overview.</p>';
 if(t==='confidence'){
  const n=[1,2,3,4,5].map(i=>es.filter(e=>e.rating===i).length),tot=es.length,mx=Math.max(1,...n);
  return h+`<div class="card"><b style="font-size:32px">${tot?(es.reduce((a,e)=>a+e.rating,0)/tot).toFixed(1):'–'}</b> <span class="mute">/ 5 · ${tot} responses</span>${n.map((x,i)=>`<div class="bar"><b>${i+1}</b><div><i style="width:${x/mx*100}%"></i></div><span>${x}</span></div>`).join('')}</div>`;
 }
 let list=es;
 if(t==='question')list=es.slice().sort((a,b)=>(st.votes[b.id]||0)-(st.votes[a.id]||0));
 if(t==='exit'){const un=es.filter(e=>e.body2);h+=`<div class="card"><b>Still unclear (${un.length})</b>${un.length?'<ul>'+un.map(e=>`<li>${esc(e.body2)}</li>`).join('')+'</ul>':'<p class="mute">Nothing yet.</p>'}</div><h3>All tickets</h3>`}
 return h+(list.map(e=>`<div class="card ${st.blur&&!st.rev[e.id]?'blur':''}" ${st.blur?`data-a="rev" data-v="${e.id}"`:''}>
  ${t==='question'?`<div class="vt">▲ ${st.votes[e.id]||0}</div>`:''}<p>${t==='exit'?'<b>Learned:</b> ':''}${esc(e.body)}</p>${e.body2?`<p><b>Unclear:</b> ${esc(e.body2)}</p>`:''}
  <small class="mute">${e.topic?esc(e.topic)+' · ':''}${new Date(e.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</small><button class="x" data-a="del" data-v="${e.id}">✕</button></div>`).join('')||'<p class="mute">Nothing yet. New entries appear automatically.</p>');
}
act.tool=v=>{st.tool=v;render()};
act.rev=v=>{st.rev[v]=!st.rev[v];render()};
act.copy=()=>navigator.clipboard.writeText($('#lk').value);
act.view=async v=>{st.view=v;if(['overview','trends'].includes(st.tool))st.tool='question';await loadEntries()};
act.live=async()=>{st.view=null;await loadEntries()};
act.newc=async()=>{const name=prompt('Course name?');if(!name)return;const cd=name.toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,8)+Math.random().toString(36).slice(2,5);
 const {data}=await sb.from('hub-courses').insert({name,code:cd}).select().single();st.cid=data?.id;st.tool='overview';load()};
act.addl=async()=>{const t=$('#nl').value.trim();if(!t)return;await sb.from('hub-lessons').insert({course_id:st.cid,title:t});load()};
act.act=async id=>{await sb.from('hub-sessions').update({active:false}).eq('course_id',st.cid).eq('active',true);await sb.from('hub-sessions').insert({course_id:st.cid,lesson_id:id});st.view=null;load()};
act.end=async()=>{await sb.from('hub-sessions').update({active:false}).eq('id',st.sess.id);load()};
act.acc=async()=>{await sb.from('hub-sessions').update({accepting:!st.sess.accepting}).eq('id',st.sess.id);load()};
act.arch=async v=>{const s=st.sessions.find(x=>x.id===v);await sb.from('hub-sessions').update({archived:!s.archived}).eq('id',v);load()};
act.dels=async v=>{if(confirm('Delete this session and all its responses? This cannot be undone.')){await sb.from('hub-sessions').delete().eq('id',v);load()}};
act.dell=async v=>{if(confirm('Delete this lesson and its sessions? This cannot be undone.')){await sb.from('hub-lessons').delete().eq('id',v);load()}};
act.delc=async()=>{const c=st.courses.find(x=>x.id===st.cid);if(prompt('Type the course name to delete it with all lessons, sessions and responses:')===c.name){await sb.from('hub-courses').delete().eq('id',c.id);st.cid=null;st.view=null;load()}};
act.del=async v=>{await sb.from('hub-entries').delete().eq('id',v);loadEntries()};
act.clr=async()=>{const s=cur();if(s&&confirm('Clear all '+T[st.tool][0]+' entries for this session?')){await sb.from('hub-entries').delete().eq('session_id',s.id).eq('tool',st.tool);loadEntries()}};
act.csv=async v=>{
 const ids=v==='c'?st.sessions.map(s=>s.id):[v];if(!ids.length)return;
 const {data}=await sb.from('hub-entries').select('*').in('session_id',ids).order('created_at');
 const sm=Object.fromEntries(st.sessions.map(s=>[s.id,s])),cn=st.courses.find(c=>c.id===st.cid).name,q=x=>'"'+String(x??'').replace(/"/g,'""')+'"';
 const rows=[['course','lesson','date','tool','text','text2','topic','rating'],...(data||[]).map(e=>[cn,ltitle(sm[e.session_id]),e.created_at,e.tool,e.body,e.body2,e.topic,e.rating])];
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));
 a.download='classroomhub-'+(v==='c'?'course':'session')+'.csv';a.click();
};
</script>
</body>
